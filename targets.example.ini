# Copy to targets.ini (mode 600) and adjust. One section per target, plus [general] and [zabbix].

[general]
# time zone for the timestamps inside the container
tz = Europe/Berlin
# only used when Zabbix cannot be reached: then run.py mails the result itself (local "mail" command)
mail_to = you@example.org
# image built from the Containerfile
image = localhost/local/e2e-check:latest

[zabbix]
# Zabbix server/proxy that receives the trapper values
server = 127.0.0.1
port = 10051
# names of items and triggers created by zbx_setup.py: en or de
lang = en
# existing trigger "internet unreachable" (substring of its name): the E2E failure trigger depends on it
internet_trigger = Internet unreachable
# who may send trapper values
trapper_hosts = 127.0.0.1,::1

# A Nextcloud with Collabora Online. credentials = env file with NC_URL, NC_USER, NC_PASS (mode 600).
[cloud]
kind = nextcloud
credentials = .credentials-cloud
zabbix_host = Nextcloud
env = NC_LANG=en

# A website with a client-side search. Adjust the selectors to your theme (see check_site_search.py).
[site]
kind = site
zabbix_host = Website
env = SITE_URL=https://www.example.org SITE_TERM=monitoring
